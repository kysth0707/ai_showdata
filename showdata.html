<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>GeekHub 게시글 대시보드</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --gray: #9ca3af; --red: #ef4444; --mint: #10b981; --blue: #3b82f6; --purple: #6366f1;
            --bg-gray: #f3f4f6; --bg-red: #fee2e2; --bg-mint: #d1fae5; --bg-blue: #dbeafe;
        }
        body { font-family: 'Pretendard', sans-serif; background: #fafafa; margin: 0; }
        .container { width: 1000px; margin: 0 auto; padding: 60px 0; display: flex; flex-direction: column; }

        /* 프로필 & 요약 */
        .profile { text-align: center; margin-bottom: 40px; }
        .profile img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--blue); }
        .summary-wrapper { display: flex; justify-content: center; width: 100%; margin-bottom: 50px; }
        .summary { display: flex; gap: 15px; width: 950px; }
        .s-card { flex: 1; padding: 20px; border-radius: 12px; font-weight: bold; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .s-card b { display: block; font-size: 24px; margin-top: 8px; }

        /* 활동 잔디 */
        .grass-box { background: #fff; border: 1px solid #e1e4e8; border-radius: 12px; padding: 25px; margin-bottom: 50px; position: relative; }
        .grass-grid { display: grid; grid-template-rows: repeat(7, 12px); grid-auto-flow: column; grid-auto-columns: 12px; gap: 4px; overflow-x: auto; }
        .cell { width: 12px; height: 12px; border-radius: 2px; background: #ebedf0; position: relative; box-sizing: border-box; }
        .cell.today { outline: 2px solid #24292e; outline-offset: 1px; z-index: 1; }
        .cell:hover::after { 
            content: attr(data-info); position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
            background: #333; color: #fff; padding: 5px 10px; border-radius: 4px; font-size: 11px; white-space: nowrap; z-index: 100; opacity: 1 !important;
        }

        /* 타임라인 슬라이더 */
        .timeline-section { width: 100%; position: relative; margin-bottom: 50px; }
        .slider-container { display: flex; align-items: center; gap: 10px; }
        .nav-btn { background: #fff; border: 1px solid #ddd; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex-shrink: 0; }
        .drag-wrapper { display: flex; gap: 20px; overflow-x: hidden; scroll-behavior: smooth; padding: 15px 5px; flex: 1; }
        .post-card { min-width: 280px; padding: 20px; border: 1px solid #eee; border-radius: 12px; background: #fff; text-decoration: none; color: inherit; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.03); box-sizing: border-box; }
        .post-card:hover { border-color: var(--blue); transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .post-card b { display: block; height: 50px; overflow: hidden; margin: 10px 0; line-height: 1.5; font-size: 15px; }

        /* 그래프 및 탭 */
        .chart-container { background: #fff; padding: 30px; border: 1px solid #eee; border-radius: 15px; margin-bottom: 40px; }
        .tab-btn { padding: 8px 14px; border-radius: 20px; border: 1px solid #eee; background: #f8f9fa; cursor: pointer; font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
        .tab-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }

        /* 모달 */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 9999; overflow-y: auto; }
        .modal-content { max-width: 900px; margin: 50px auto; padding: 0 20px; }
        .modal-day-row { border-bottom: 1px solid #eee; padding: 25px 0; display: flex; gap: 30px; }
        .modal-date { min-width: 110px; font-weight: bold; color: var(--blue); font-size: 18px; }
        .stat-item { display: inline-flex; align-items: center; gap: 5px; margin-right: 15px; font-size: 13px; }

/* 가중치 설정창 스타일 */
.weight-config {
        display: none; /* 기본적으로 숨김 */
        background: #f9fafb;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 15px;
        margin-top: 15px;
        justify-content: center;
        gap: 20px;
        animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    
    .weight-item { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 12px; color: #4b5563; }
    .weight-item input {
        width: 60px;
        padding: 4px;
        border: 1px solid #ddd;
        border-radius: 4px;
        text-align: center;
        font-weight: bold;
    }
    </style>
</head>
<body>

<div class="container">
    <div class="profile">
        <img id="p-img" src="" alt="P">
        <h1 id="p-nick">로딩 중...</h1>
    </div>

    <div class="summary-wrapper">
        <div class="summary">
            <div class="s-card" style="background:var(--bg-blue); color:var(--blue)"><span><i class="fas fa-pen"></i> 총 게시글</span><b id="total-p">0</b></div>
            <div class="s-card" style="background:var(--bg-gray); color:#4b5563"><span><i class="fas fa-eye"></i> 총 조회수</span><b id="total-v">0</b></div>
            <div class="s-card" style="background:var(--bg-red); color:var(--red)"><span><i class="fas fa-heart"></i> 총 하트수</span><b id="total-l">0</b></div>
            <div class="s-card" style="background:var(--bg-mint); color:#10b981"><span><i class="fas fa-comment"></i> 총 댓글수</span><b id="total-c">0</b></div>
        </div>
    </div>

    <div class="grass-box">
		<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
			<h3 style="margin:0">잔디 지표</h3>
			<div id="grass-tabs" style="display:flex; gap:8px;">
				<button class="tab-btn active" onclick="renderGrass('post')"><i class="fas fa-pen"></i> 활동</button>
				<button class="tab-btn" onclick="renderGrass('viewCount')" style="--blue:var(--gray)"><i class="fas fa-eye"></i> 조회</button>
				<button class="tab-btn" onclick="renderGrass('likeCount')" style="--blue:var(--red)"><i class="fas fa-heart"></i> 하트</button>
				<button class="tab-btn" onclick="renderGrass('commentCount')" style="--blue:var(--mint)"><i class="fas fa-comment"></i> 댓글</button>
				<button class="tab-btn" onclick="renderGrass('total')" style="--blue:var(--purple)"><i class="fas fa-plus-circle"></i> 총합</button>
			</div>
		</div>
	
		<div id="weight-panel" class="weight-config">
			<div class="weight-item"><span>활동 가중치</span><input type="number" id="w-post" value="1.0" step="0.1" onchange="renderGrass('total')"></div>
			<div class="weight-item"><span>조회 가중치</span><input type="number" id="w-view" value="0.1" step="0.1" onchange="renderGrass('total')"></div>
			<div class="weight-item"><span>하트 가중치</span><input type="number" id="w-like" value="2.0" step="0.1" onchange="renderGrass('total')"></div>
			<div class="weight-item"><span>댓글 가중치</span><input type="number" id="w-comm" value="3.0" step="0.1" onchange="renderGrass('total')"></div>
		</div>
	
		<div id="grass-grid" class="grass-grid"></div>
	</div>

    <div class="timeline-section">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3 style="margin:0;">🔥 활동 타임라인</h3>
            <button onclick="openModal()" style="border:none; background:none; color:var(--blue); cursor:pointer; font-weight:bold; font-size:16px;">전부 보기 (세로형) <i class="fas fa-external-link-alt"></i></button>
        </div>
        <div class="slider-container">
            <button class="nav-btn" onclick="slide('left')"><i class="fas fa-chevron-left"></i></button>
            <div class="drag-wrapper" id="drag-wrapper"></div>
            <button class="nav-btn" onclick="slide('right')"><i class="fas fa-chevron-right"></i></button>
        </div>
    </div>

    <div class="chart-container">
        <h3>📊 포스트별 성과 (누적 막대)</h3>
        <div class="btn-group" style="margin-bottom:25px; display:flex; gap:12px;">
            <button class="tab-btn active" onclick="updatePostChart(this, 'viewCount')"><i class="fas fa-eye"></i> 조회수</button>
            <button class="tab-btn" onclick="updatePostChart(this, 'likeCount')"><i class="fas fa-heart"></i> 하트수</button>
            <button class="tab-btn" onclick="updatePostChart(this, 'commentCount')"><i class="fas fa-comment"></i> 댓글수</button>
            <button class="tab-btn" onclick="updatePostChart(this, 'all')"><i class="fas fa-th-list"></i> 모두보기</button>
        </div>
        <canvas id="postChart" height="100"></canvas>
    </div>

    <div class="chart-container">
        <h3>📂 게시판별 통계 (그룹 막대)</h3>
        <canvas id="boardChart" height="120"></canvas>
    </div>
</div>

<div id="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
            <h1>전체 활동 타임라인</h1>
            <button onclick="closeModal()" style="font-size:40px; border:none; background:none; cursor:pointer;">&times;</button>
        </div>
        <div id="modal-list"></div>
    </div>
</div>

<script>
	let posts = {"content":[{"id":408,"title":"네?? 뺄셈이랑 나눗셈이 없다고요? - 실수 체의 공리를 살펴보자","viewCount":14,"likeCount":2,"commentCount":0,"createdAt":"2026-01-29T08:26:33.313930Z","thumbnailUrl":"https://for-geekhub-uploads.s3.ap-northeast-2.amazonaws.com/uploads/image/2026/01/29/3b8c0236-45ba-4e60-8c7a-8aa9d6b96e96-clipboard-1769673463671.png","authorNickname":"노잼","authorProfileImage":"https://for-geekhub-uploads.s3.ap-northeast-2.amazonaws.com/uploads/image/2026/01/20/0070bb73-5b78-4109-a03b-6dfc499cd859-20210201112150.jpg","boardId":10},{"id":397,"title":"테트레이션, 복소수의 자연수 제곱, 드무아브르 공식을 접해보자!","viewCount":20,"likeCount":2,"commentCount":0,"createdAt":"2026-01-28T17:36:48.493519Z","boardId":10},{"id":382,"title":"이 함수가 어떻게 되나요?","viewCount":33,"likeCount":3,"commentCount":1,"createdAt":"2026-01-28T08:17:42.173093Z","boardId":11},{"id":379,"title":"무한에서는 숫자 위치를 막 바꾸면 안 된다고? 리만 재배열 정리","viewCount":50,"likeCount":8,"commentCount":8,"createdAt":"2026-01-28T05:16:05.875794Z","boardId":10},{"id":355,"title":"GeekHub AI 지식 맵 사이트","viewCount":63,"likeCount":12,"commentCount":9,"createdAt":"2026-01-27T06:33:55.788420Z","boardId":10}]};
	if (localStorage.getItem('geekhub_api') !== null) {
		posts = JSON.parse(localStorage.getItem("geekhub_api"));
		// console.log(posts)
	}
	else
	{
		alert('비정상적인 데이터\n기본 데이터로 설정합니다.')
	}
	// localStorage.getItem("geekhub_api")
    const boards = [{"id":10,"name":"작품 자랑하기"},{"id":11,"name":"메이킹 SOS"},{"id":15,"name":"메이킹 정보공유"},{"id":5,"name":"자유게시판"},{"id":1,"name":"공지사항"}];
    
    let postChartObj;
    const postData = posts.content;

    function init() {
        const author = postData[0];
        document.getElementById('p-img').src = author.authorProfileImage;
        document.getElementById('p-nick').innerText = `${author.authorNickname}님의 게시글 분석`;
        
        // 요약 정보 데이터 바인딩
        document.getElementById('total-p').innerText = postData.length.toLocaleString();
        document.getElementById('total-v').innerText = postData.reduce((s,p)=>s+p.viewCount, 0).toLocaleString();
        document.getElementById('total-l').innerText = postData.reduce((s,p)=>s+p.likeCount, 0).toLocaleString();
        document.getElementById('total-c').innerText = postData.reduce((s,p)=>s+p.commentCount, 0).toLocaleString();

        renderGrass('post'); 
        renderTimeline();    
        renderCharts();      
    }

    function renderGrass(type) {
    const tabs = document.querySelectorAll('#grass-tabs .tab-btn');
    const typeMap = { 'post': 0, 'viewCount': 1, 'likeCount': 2, 'commentCount': 3, 'total': 4 };
    tabs.forEach((btn, idx) => btn.classList.toggle('active', idx === typeMap[type]));

    // 총합일 때만 가중치 패널 보이기
    const weightPanel = document.getElementById('weight-panel');
    weightPanel.style.display = (type === 'total') ? 'flex' : 'none';

    // 가중치 값 가져오기
    const w = {
        post: parseFloat(document.getElementById('w-post').value) || 0,
        view: parseFloat(document.getElementById('w-view').value) || 0,
        like: parseFloat(document.getElementById('w-like').value) || 0,
        comm: parseFloat(document.getElementById('w-comm').value) || 0
    };

    const grassGrid = document.getElementById('grass-grid');
    grassGrid.innerHTML = '';
    const today = new Date();
    const todayStr = today.toISOString().split('T')[0];

    const dailyStats = {};
    postData.forEach(p => {
        const date = p.createdAt.split('T')[0];
        if (!dailyStats[date]) dailyStats[date] = { post: 0, viewCount: 0, likeCount: 0, commentCount: 0, total: 0 };
        dailyStats[date].post += 1;
        dailyStats[date].viewCount += p.viewCount;
        dailyStats[date].likeCount += p.likeCount;
        dailyStats[date].commentCount += p.commentCount;
        
        // 가중치가 적용된 실시간 총합 계산
        dailyStats[date].total = (dailyStats[date].post * w.post) + 
                                 (dailyStats[date].viewCount * w.view) + 
                                 (dailyStats[date].likeCount * w.like) + 
                                 (dailyStats[date].commentCount * w.comm);
    });

    const values = Object.values(dailyStats).map(s => s[type]);
    const maxVal = Math.max(...values, 1);
    const themeColors = { post: '#216e39', viewCount: '#9ca3af', likeCount: '#ef4444', commentCount: '#10b981', total: '#6366f1' };

    for(let i=0; i<371; i++) {
        const d = new Date(today); d.setDate(d.getDate() - (370 - i));
        const dStr = d.toISOString().split('T')[0];
        const stats = dailyStats[dStr] || { post: 0, viewCount: 0, likeCount: 0, commentCount: 0, total: 0 };
        
        // 화면 갱신 시점에 다시 계산 (위에서 이미 계산했지만 안전하게)
        if (type === 'total') {
            stats.total = (stats.post * w.post) + (stats.viewCount * w.view) + (stats.likeCount * w.like) + (stats.commentCount * w.comm);
        }

        const val = stats[type];
        const cell = document.createElement('div');
        cell.className = 'cell' + (dStr === todayStr ? ' today' : '');
        
        // 소수점 1자리까지 표시 (가중치 때문에 소수가 나올 수 있음)
        const displayVal = Number.isInteger(val) ? val : val.toFixed(1);
        const unit = type === 'total' ? '점' : '개';
        cell.setAttribute('data-info', `${dStr} : ${displayVal}${unit}`);
        
        if(val > 0) {
            const opacity = 0.1 + (val / maxVal) * 0.9;
            cell.style.background = themeColors[type];
            cell.style.opacity = opacity;
        }
        grassGrid.appendChild(cell);
    }
}

    function renderTimeline() {
        const wrapper = document.getElementById('drag-wrapper');
        [...postData].reverse().forEach(p => {
            wrapper.innerHTML += `
                <a href="https://www.geekhub.kr/posts/${p.id}" target="_blank" class="post-card">
                    <div style="font-size:12px; color:#888;">${p.createdAt.split('T')[0]} (ID: ${p.id})</div>
                    <b>${p.title}</b>
                    <div style="display:flex; gap:12px; font-size:13px;">
                        <span style="color:var(--gray)"><i class="fas fa-eye"></i> ${p.viewCount}</span>
                        <span style="color:var(--red)"><i class="fas fa-heart"></i> ${p.likeCount}</span>
                        <span style="color:var(--mint)"><i class="fas fa-comment"></i> ${p.commentCount}</span>
                    </div>
                </a>`;
        });
    }

    function renderCharts() {
        postChartObj = new Chart(document.getElementById('postChart').getContext('2d'), {
            type: 'bar',
            data: {
                labels: postData.map(p => `${p.id}. ${p.title.substring(0,10)}...`),
                datasets: [
                    { label: '조회', data: postData.map(p=>p.viewCount), backgroundColor: '#9ca3af' },
                    { label: '하트', data: postData.map(p=>p.likeCount), backgroundColor: '#ef4444' },
                    { label: '댓글', data: postData.map(p=>p.commentCount), backgroundColor: '#10b981' }
                ]
            },
            options: { scales: { x: { stacked: true }, y: { stacked: true } }, plugins: { legend: { display: false } } }
        });
        new Chart(document.getElementById('boardChart').getContext('2d'), {
            type: 'bar',
            data: {
                labels: boards.map(b => b.name),
                datasets: [
                    { label: '조회', data: boards.map(b => postData.filter(p=>p.boardId===b.id).reduce((s,p)=>s+p.viewCount,0)), backgroundColor: '#9ca3af' },
                    { label: '하트', data: boards.map(b => postData.filter(p=>p.boardId===b.id).reduce((s,p)=>s+p.likeCount,0)), backgroundColor: '#ef4444' },
                    { label: '댓글', data: boards.map(b => postData.filter(p=>p.boardId===b.id).reduce((s,p)=>s+p.commentCount,0)), backgroundColor: '#10b981' }
                ]
            },
            options: { plugins: { legend: { position: 'bottom' } } }
        });
    }

    function slide(dir) {
        const slider = document.getElementById('drag-wrapper');
        const card = document.querySelector('.post-card');
        if (!card) return;
        const moveDistance = card.offsetWidth + 20; 
        slider.scrollLeft += (dir === 'right' ? moveDistance : -moveDistance);
    }

    function updatePostChart(btn, type) {
        document.querySelectorAll('.chart-container .tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if(type === 'all') {
            postChartObj.data.datasets.forEach(ds => ds.hidden = false);
            postChartObj.options.plugins.legend.display = true;
        } else {
            const map = { 'viewCount': '조회', 'likeCount': '하트', 'commentCount': '댓글' };
            postChartObj.data.datasets.forEach(ds => ds.hidden = (ds.label !== map[type]));
            postChartObj.options.plugins.legend.display = false;
        }
        postChartObj.update();
    }

    function openModal() {
        const list = document.getElementById('modal-list');
        list.innerHTML = '';
        const dates = [...new Set(postData.map(p=>p.createdAt.split('T')[0]))].sort().reverse();
        dates.forEach(d => {
            const row = document.createElement('div');
            row.className = 'modal-day-row';
            row.innerHTML = `<div class="modal-date">${d}</div><div style="flex:1; display:grid; gap:12px;"></div>`;
            postData.filter(p=>p.createdAt.startsWith(d)).forEach(p => {
                row.children[1].innerHTML += `
                    <a href="https://www.geekhub.kr/posts/${p.id}" target="_blank" class="post-card" style="min-width:auto; margin:0;">
                        <b>${p.id}. ${p.title}</b>
                        <div style="margin-top:5px;">
                            <span class="stat-item" style="color:var(--gray)"><i class="fas fa-eye"></i> ${p.viewCount}</span>
                            <span class="stat-item" style="color:var(--red)"><i class="fas fa-heart"></i> ${p.likeCount}</span>
                            <span class="stat-item" style="color:var(--mint)"><i class="fas fa-comment"></i> ${p.commentCount}</span>
                        </div>
                    </a>`;
            });
            list.appendChild(row);
        });
        document.getElementById('modal').style.display = 'block';
        document.body.style.overflow = 'hidden';
    }
    function closeModal() { document.getElementById('modal').style.display = 'none'; document.body.style.overflow = 'auto'; }

    init();
</script>
</body>

</html>
